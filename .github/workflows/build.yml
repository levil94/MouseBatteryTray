name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 默认只读：fork 提交的 PR 拿不到写权限，无法改动仓库内容
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配色对比度检查
        shell: pwsh
        run: python tools/check_contrast.py

      - name: 编译
        shell: pwsh
        run: ./build.ps1

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item MouseBatteryTray.exe dist/
          Copy-Item hidapi.dll dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath MouseBatteryTray-win-x64.zip -Force
          "zip size: {0:N0} bytes" -f (Get-Item MouseBatteryTray-win-x64.zip).Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MouseBatteryTray-win-x64
          path: MouseBatteryTray-win-x64.zip
          if-no-files-found: error

  release:
    # 只有打 tag 时才发布，且单独授予写权限
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: MouseBatteryTray-win-x64

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: MouseBatteryTray-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
