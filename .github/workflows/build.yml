name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译
        shell: pwsh
        run: ./build.ps1

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item MouseBatteryTray.exe dist/
          Copy-Item hidapi.dll dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath MouseBatteryTray-win-x64.zip -Force
          Get-ChildItem dist | Format-Table Name, Length
          "zip size: {0:N0} bytes" -f (Get-Item MouseBatteryTray-win-x64.zip).Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MouseBatteryTray-win-x64
          path: MouseBatteryTray-win-x64.zip
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MouseBatteryTray-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
